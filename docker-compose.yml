# 完整镜像 + Compose 编排（PostgreSQL + Redis + Django + Celery worker + Nginx frontend）。
# 服务器部署手册见 README 的「Docker Compose 部署手册」。

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "False"
  FILE_UPLOAD_TEMP_DIR: ${FILE_UPLOAD_TEMP_DIR:-/app/media/tmp_uploads}
  RESUME_OCR_MAX_PAGES: ${RESUME_OCR_MAX_PAGES:-20}
  RESUME_OCR_DPI: ${RESUME_OCR_DPI:-200}
  RESUME_OCR_TIMEOUT_SECONDS: ${RESUME_OCR_TIMEOUT_SECONDS:-120}
  RESUME_OCR_CONCURRENCY: ${RESUME_OCR_CONCURRENCY:-2}

services:
  db:
    build:
      context: ./docker/postgres
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:16}
    image: smart-resume-filter-postgres:${POSTGRES_VERSION:-16}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    build:
      context: ./docker/redis
      args:
        REDIS_IMAGE: ${REDIS_IMAGE:-redis:7}
    image: smart-resume-filter-redis:${REDIS_VERSION:-7}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.3-slim}
    image: smart-resume-filter-backend:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_SEED_BASE: ${RUN_SEED_BASE:-0}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-1800}
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: smart-resume-filter-backend:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
      RUN_SEED_BASE: "0"
    command: celery -A config worker -l info -Q default --prefetch-multiplier=1
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    image: smart-resume-filter-backend:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
      RUN_SEED_BASE: "0"
    command: celery -A config worker -l info -Q ai --pool=threads --concurrency=${AI_WORKER_CONCURRENCY:-20} --prefetch-multiplier=1
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup-scheduler:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:16}
    image: smart-resume-filter-backup:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    command: schedule
    environment: &backup-env
      APP_VERSION: ${APP_VERSION:-latest}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RESTIC_REPOSITORY: /repository/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP_HOURLY: ${BACKUP_KEEP_HOURLY:-48}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
    volumes:
      - media_data:/data/media:ro
      - ${BACKUP_TARGET_PATH:?Set BACKUP_TARGET_PATH in .env}:/repository
    depends_on:
      db:
        condition: service_healthy

  backup:
    profiles: ["backup"]
    image: smart-resume-filter-backup:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    command: backup
    environment: *backup-env
    volumes:
      - media_data:/data/media:ro
      - ${BACKUP_TARGET_PATH:?Set BACKUP_TARGET_PATH in .env}:/repository
    depends_on:
      db:
        condition: service_healthy

  backup-verify:
    profiles: ["backup"]
    image: smart-resume-filter-backup:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    command: verify
    environment: *backup-env
    volumes:
      - ${BACKUP_TARGET_PATH:?Set BACKUP_TARGET_PATH in .env}:/repository

  restore:
    profiles: ["restore"]
    image: smart-resume-filter-backup:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    command: restore
    environment:
      <<: *backup-env
      RESTORE_DATABASE: ${RESTORE_DATABASE:-srf_restore}
      RESTORE_MEDIA_ROOT: /restore-media
      RESTORE_MEDIA: ${RESTORE_MEDIA:-1}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
      ALLOW_PRODUCTION_OVERWRITE: ${ALLOW_PRODUCTION_OVERWRITE:-}
      RESTIC_SNAPSHOT: ${RESTIC_SNAPSHOT:-latest}
    volumes:
      - media_data:/restore-media
      - ${BACKUP_TARGET_PATH:?Set BACKUP_TARGET_PATH in .env}:/repository
    depends_on:
      db:
        condition: service_healthy

  init:
    profiles: ["init"]
    image: smart-resume-filter-backend:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      RUN_SEED_BASE: "1"
    command: python manage.py check
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: smart-resume-filter-frontend:${APP_VERSION:-latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media_data:
